# Production stack for the DigitalOcean Droplet. Runs beside Ilado FMS and
# reuses that stack's Caddy (reverse proxy + Let's Encrypt) via fms-net,
# instead of the Traefik setup this repo originally shipped with.
#
#   cp .env.example .env   # fill in production values
#   docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_BASE_PATH: ""
      DB_HOST: db
      DB_PORT: "3306"
      # The real bcrypt hash contains $-signs that env_file / ${VAR} substitution
      # corrupts (Compose re-interpolates $<letter...> sequences inside substituted
      # values). $$ here is the one reliable escape; set the real value on the
      # droplet by editing this line directly, not via .env.
      ADMIN_PASSWORD_HASH: $$2y$$10$$C/Yzz7FHf5GhxOclvhExI.E.xyfSzMhuC3UnB2cUOTuT1z8ex56Oi
      # Caddy reaches the app from the fms-net Docker network; trust its forwarded headers.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8}
    volumes:
      - ./storage:/var/www/html/storage
      - ./public/assets/img/projects:/var/www/html/public/assets/img/projects
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - internal
      - fms-net

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?set DB_ROOT_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:-portfolio}
      # Read by docker/mysql/02-grants.sh to create the least-privilege app user.
      APP_DB_USER: ${DB_USER:?set DB_USER in .env}
      APP_DB_PASS: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-grants.sh:/docker-entrypoint-initdb.d/02-grants.sh:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/portfolio.cnf:ro
    mem_limit: 256m
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  internal:
    internal: true
  fms-net:
    external: true

volumes:
  db-data:
